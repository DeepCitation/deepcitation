name: Publish to npm

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g., v1.2.3)"
        required: true
      release_id:
        description: "GitHub release ID"
        required: true

concurrency:
  group: publish
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only run if this was converted from a pre-release
    if: github.event.release.prerelease == false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          token: ''

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install

      - name: Build package
        run: bun run build

      - name: Debug npm auth state
        run: |
          echo "=== npm version ==="
          npm --version
          echo "=== NPM_CONFIG_USERCONFIG ==="
          echo "$NPM_CONFIG_USERCONFIG"
          echo "=== userconfig contents ==="
          cat "$NPM_CONFIG_USERCONFIG" 2>/dev/null || echo "(no file)"
          echo "=== _authToken value ==="
          npm config get "//registry.npmjs.org/:_authToken" 2>&1 || true
          echo "=== OIDC env ==="
          echo "GITHUB_ACTIONS=$GITHUB_ACTIONS"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL present: $([[ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]] && echo yes || echo no)"

      - name: Clear npm token (use OIDC trusted publishing)
        run: npm config delete "//registry.npmjs.org/:_authToken"

      - name: Debug npm auth state after clear
        run: |
          echo "=== userconfig contents after delete ==="
          cat "$NPM_CONFIG_USERCONFIG" 2>/dev/null || echo "(no file)"
          echo "=== _authToken value after delete ==="
          npm config get "//registry.npmjs.org/:_authToken" 2>&1 || true

      - name: Publish to npm
        run: npm publish --access public --provenance --loglevel=verbose

      - name: Update release description
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        with:
          script: |
            const releaseId = context.payload.release?.id || process.env.RELEASE_ID;
            if (!releaseId) {
              console.log('No release ID found, skipping release update');
              return;
            }

            // Fetch the release to get the current body
            const release = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId
            });

            const currentBody = release.data.body || '';

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              body: currentBody + '\n\n✅ **Published to npm registry**'
            });
