name: Publish to npm

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g., v1.2.3)"
        required: true
      release_id:
        description: "GitHub release ID"
        required: true

concurrency:
  group: publish
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only run if this was converted from a pre-release
    if: github.event.release.prerelease == false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          token: ''

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Upgrade npm
        run: |
          # Bundled npm on some runner images fails with MODULE_NOT_FOUND.
          # Bootstrap via curl + tar to avoid invoking the broken binary.
          # Delete the old npm dir first to avoid stale-file conflicts when overlaying.
          NPM_LATEST=$(curl -fsSL https://registry.npmjs.org/npm/latest | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).version))")
          NPM_DIR=$(node -e "const p=require('path');process.stdout.write(p.resolve(p.dirname(process.execPath),'../lib/node_modules/npm'))")
          echo "Upgrading to npm@${NPM_LATEST} at ${NPM_DIR}"
          rm -rf "$NPM_DIR" && mkdir -p "$NPM_DIR"
          curl -fsSL "https://registry.npmjs.org/npm/-/npm-${NPM_LATEST}.tgz" | tar -xz --strip-components=1 -C "$NPM_DIR"
          npm --version

      - name: Install dependencies
        run: npm install

      - name: Build package
        run: bun run build

      - name: Clear npm token (use OIDC trusted publishing)
        run: npm config delete "//registry.npmjs.org/:_authToken"

      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Update release description
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        with:
          script: |
            const releaseId = context.payload.release?.id || process.env.RELEASE_ID;
            if (!releaseId) {
              console.log('No release ID found, skipping release update');
              return;
            }

            // Fetch the release to get the current body
            const release = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId
            });

            const currentBody = release.data.body || '';

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              body: currentBody + '\n\n✅ **Published to npm registry**'
            });
