name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          token: ''

      - name: Upgrade npm
        run: |
          # Bundled npm on some runner images fails with MODULE_NOT_FOUND.
          # Bootstrap via curl + tar to avoid invoking the broken binary.
          # Delete the old npm dir first to avoid stale-file conflicts when overlaying.
          NPM_LATEST=$(curl -fsSL https://registry.npmjs.org/npm/latest | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).version))")
          NPM_DIR=$(node -e "const p=require('path');process.stdout.write(p.resolve(p.dirname(process.execPath),'../lib/node_modules/npm'))")
          echo "Upgrading to npm@${NPM_LATEST} at ${NPM_DIR}"
          rm -rf "$NPM_DIR" && mkdir -p "$NPM_DIR"
          curl -fsSL "https://registry.npmjs.org/npm/-/npm-${NPM_LATEST}.tgz" | tar -xz --strip-components=1 -C "$NPM_DIR"
          npm --version

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npx biome ci ./src

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Bundle size check
        run: bun run size

      - name: Bump version
        id: bump
        run: |
          # Bump version in package.json (no git tag, no commit)
          NEW_VERSION=$(npm version ${{ inputs.version }} --no-git-tag-version)
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "Bumped to ${NEW_VERSION}"

      - name: Update CHANGELOG.md
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          # Strip the leading 'v'
          SEMVER="${VERSION#v}"
          DATE=$(date +%Y-%m-%d)

          if [ -f CHANGELOG.md ] && grep -q '\[Unreleased\]' CHANGELOG.md; then
            # Replace [Unreleased] heading with the new version heading,
            # and add a fresh [Unreleased] section above it
            sed -i "s/## \[Unreleased\]/## [Unreleased]\n\n## [${SEMVER}] - ${DATE}/" CHANGELOG.md
          fi

      - name: Commit and tag
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add package.json CHANGELOG.md
          git commit -m "chore: release ${VERSION}"
          git tag "${VERSION}"
          git push origin main --tags

      - name: Extract changelog entry
        id: changelog
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          SEMVER="${VERSION#v}"

          # Extract the section between this version's heading and the next heading
          NOTES=$(awk "/^## \[${SEMVER}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)

          if [ -z "$NOTES" ] || [ "$(echo "$NOTES" | tr -d '[:space:]')" = "" ]; then
            # Changelog section is empty — fall back to auto-generated notes
            echo "has_notes=false" >> $GITHUB_OUTPUT
          else
            # Write to file for the release step
            echo "$NOTES" > /tmp/release-notes.md
            echo "" >> /tmp/release-notes.md
            echo "**Full Changelog:** https://github.com/${{ github.repository }}/compare/v${PREV_VERSION}...${VERSION}" >> /tmp/release-notes.md
            echo "has_notes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        id: create_release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const version = '${{ steps.bump.outputs.version }}';
            const hasNotes = '${{ steps.changelog.outputs.has_notes }}' === 'true';

            const opts = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: version,
              name: version,
              draft: false,
              prerelease: false,
            };

            if (hasNotes) {
              opts.body = fs.readFileSync('/tmp/release-notes.md', 'utf8');
            } else {
              // Empty changelog section — use GitHub's auto-generated notes as a starting point
              opts.generate_release_notes = true;
            }

            const release = await github.rest.repos.createRelease(opts);
            core.setOutput('release_id', release.data.id);

      - name: Verify README in tarball
        run: |
          npm pack --dry-run 2>&1 | grep -q 'README.md' || { echo "ERROR: README.md missing from npm tarball"; exit 1; }
      # npm publish is handled by publish.yml which triggers on the release event above.
      # publish.yml uses OIDC Trusted Publishing configured on npmjs.com for that workflow.
